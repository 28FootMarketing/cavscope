<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="CavScope">
  <title>CavScope</title>
  <!-- Single-color mark for dark backgrounds outside the app's own gold
       accent — a footer on a photo, a dark third-party surface. -->
  <path d="M 155.70 139.00 A 68 68 0 1 1 155.70 61.00"
        fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  <g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round">
    <line x1="100" y1="6"   x2="100" y2="26"/>
    <line x1="100" y1="174" x2="100" y2="194"/>
    <line x1="6"   y1="100" x2="26"  y2="100"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
    <line x1="100" y1="40" x2="100" y2="64"/>
    <line x1="100" y1="136" x2="100" y2="160"/>
    <line x1="40"  y1="100" x2="64"  y2="100"/>
  </g>
  <circle cx="100" cy="100" r="30" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <circle cx="91" cy="91" r="5" fill="#FFFFFF"/>
</svg>
