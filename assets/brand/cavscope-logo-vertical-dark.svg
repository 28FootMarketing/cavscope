<svg xmlns="http://www.w3.org/2000/svg" width="320" height="300" viewBox="0 0 320 300" role="img" aria-label="CavScope">
  <title>CavScope</title>
  <defs>
    <linearGradient id="cs-ring-v" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B4E"/>
      <stop offset="100%" stop-color="#F2B84C"/>
    </linearGradient>
    <radialGradient id="cs-lens-v" cx="38%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#0E5A66"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </radialGradient>
  </defs>

  <g transform="translate(80,10) scale(0.8)">
    <path d="M 155.70 139.00 A 68 68 0 1 1 155.70 61.00"
          fill="none" stroke="url(#cs-ring-v)" stroke-width="16" stroke-linecap="round"/>
    <g stroke="url(#cs-ring-v)" stroke-width="10" stroke-linecap="round">
      <line x1="100" y1="6"   x2="100" y2="26"/>
      <line x1="100" y1="174" x2="100" y2="194"/>
      <line x1="6"   y1="100" x2="26"  y2="100"/>
    </g>
    <g stroke="url(#cs-ring-v)" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <line x1="100" y1="40" x2="100" y2="64"/>
      <line x1="100" y1="136" x2="100" y2="160"/>
      <line x1="40"  y1="100" x2="64"  y2="100"/>
    </g>
    <circle cx="100" cy="100" r="30" fill="#0b0e14" stroke="url(#cs-ring-v)" stroke-width="6"/>
    <circle cx="100" cy="100" r="17" fill="url(#cs-lens-v)"/>
    <circle cx="91" cy="91" r="5" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <text x="160" y="228" text-anchor="middle" font-family="'Cinzel', Georgia, 'Times New Roman', serif"
        font-weight="700" font-size="46" letter-spacing="1">
    <tspan fill="#FFFFFF">Cav</tspan><tspan fill="url(#cs-ring-v)">Scope</tspan>
  </text>
  <text x="160" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif"
        font-weight="600" font-size="14" letter-spacing="4" fill="#6B6B6B">
