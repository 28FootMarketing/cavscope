<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="CavScope">
  <title>CavScope</title>
  <defs>
    <linearGradient id="cs-ring-f" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B4E"/>
      <stop offset="100%" stop-color="#F2B84C"/>
    </linearGradient>
    <radialGradient id="cs-lens-f" cx="38%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#0E5A66"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </radialGradient>
  </defs>
  <!-- Simplified mark for small sizes: ring + lens only, no ticks or inner
       reticle lines — those disappear below ~32px and just add noise. -->
  <path d="M 155.70 139.00 A 68 68 0 1 1 155.70 61.00"
        fill="none" stroke="url(#cs-ring-f)" stroke-width="20" stroke-linecap="round"/>
  <circle cx="100" cy="100" r="26" fill="#0b0e14" stroke="url(#cs-ring-f)" stroke-width="8"/>
  <circle cx="91" cy="91" r="6" fill="#FFFFFF" opacity="0.85"/>
</svg>
