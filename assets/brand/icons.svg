<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- CavScope product icon sprite. One consistent grammar, feather-style:
       24x24 viewBox, 1.75 stroke, round caps/joins, fill="none", and every
       symbol uses stroke="currentColor" — color comes from CSS at the call
       site (color: var(-accent), var(-text-secondary), a status token, …),
       never hardcoded here. Reference with:

         <svg class="icon" width="20" height="20" aria-hidden="true">
           <use href="/assets/brand/icons.svg#icon-scan"></use>
         </svg>

       Pair every use with a visible label or an aria-label on the parent -
       this sprite carries no per-icon text alternative of its own. See
       docs/BRAND.md "Icon system" for the concept behind each mark. -->

  <symbol id="icon-scan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 8V5a1 1 0 0 1 1-1h3"/>
    <path d="M16 4h3a1 1 0 0 1 1 1v3"/>
    <path d="M20 16v3a1 1 0 0 1-1 1h-3"/>
    <path d="M8 20H5a1 1 0 0 1-1-1v-3"/>
    <line x1="4" y1="12" x2="20" y2="12"/>
  </symbol>

  <symbol id="icon-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/>
    <circle cx="12" cy="12" r="3"/>
  </symbol>

  <symbol id="icon-assure" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3 4.5 5.5v5c0 5 3.2 8.3 7.5 10 4.3-1.7 7.5-5 7.5-10v-5L12 3Z"/>
    <path d="m9 12 2 2 4-4.5"/>
  </symbol>

  <symbol id="icon-reports" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3h9l3 3v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/>
    <path d="M15 3v3h3"/>
    <line x1="8" y1="12" x2="16" y2="12"/>
    <line x1="8" y1="15.5" x2="16" y2="15.5"/>
    <line x1="8" y1="19" x2="12.5" y2="19"/>
  </symbol>

  <symbol id="icon-alerts" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
