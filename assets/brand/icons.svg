  <symbol id="icon-backups" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="7.5" ry="2.75"/>
    <path d="M4.5 6v5.5c0 1.5 3.4 2.75 7.5 2.75s7.5-1.25 7.5-2.75V6"/>
    <path d="M4.5 11.5V17c0 1.5 3.4 2.75 7.5 2.75s7.5-1.25 7.5-2.75v-5.5"/>
