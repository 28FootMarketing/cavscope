  function bandColor(band) {
    if (band === 'green') return 'var(--emerald)';
    if (band === 'amber') return 'var(--amber)';
    return 'var(--rose)';
  }
  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function citeBadge(claim) {
    const fs = (claim.finding_ids || []).map(id => `F${id}`);
    const es = (claim.evidence_ids || []).map(id => `E${id}`);
    const all = [...fs, ...es];
    if (!all.length) return '';
    return `<span class="cite" data-tooltip="Finding and evidence IDs this statement is cited to." tabindex="0">[${all.join('][')}]</span>`;
  }

  function render(sitrep) {
    const root = document.getElementById('reportRoot');
    const board = sitrep.sections.board_report;
    const claims = board.claims || [];
    const plain = sitrep.sections.plain_english.items || [];
    const findings = sitrep.sections.top_findings || [];
    const evidence = sitrep.sections.evidence_index || [];
    const score = sitrep.posture_score;
    const band = sitrep.posture_band;
    const color = bandColor(band);

    root.innerHTML = `
      <div class="report-head">
        <p class="eyebrow">SITREP · ${escapeHtml(sitrep.generator.toUpperCase())} · SCAN #${sitrep.scan_id}</p>
        <h1>${escapeHtml(sitrep.headline)}</h1>
        <div class="report-meta">Organization: ${escapeHtml(sitrep.org_name)} · Target: ${escapeHtml(sitrep.website_url)} · Generated ${new Date(sitrep.generated_at).toLocaleString()}</div>

        <div class="score-row">
          <div class="gauge" data-tooltip="Posture score: one number from 0-100 summarizing exposure across all open findings. Higher is safer." tabindex="0">
            <svg viewBox="0 0 96 96">
              <circle cx="48" cy="48" r="42" fill="none" stroke="#1f3358" stroke-width="8"></circle>
              <circle cx="48" cy="48" r="42" fill="none" stroke="${color}" stroke-width="8"
                stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="${264 - (264 * score / 100)}"></circle>
            </svg>
            <div class="gauge-value"><span class="num" style="color:${color}">${score}</span><span class="of100">/ 100</span></div>
          </div>
          <div>
            <div class="band-label" style="color:${color}" data-tooltip="Green: no material gaps. Amber: gaps present, no critical breach. Red: critical exposure needs action now." tabindex="0">● ${band.toUpperCase()} POSTURE</div>
            <div class="band-desc">${board.open} open findings across every area MUSTER checks: security, email authentication, availability, accessibility, privacy, governance, and third party.</div>
          </div>
        </div>

        <div class="severity-strip">
          <div class="sev-tile critical" data-tooltip="Findings that need action immediately — active breach or outage risk." tabindex="0"><span class="n">${board.critical}</span>Critical</div>
          <div class="sev-tile high" data-tooltip="Serious findings that should be fixed this week." tabindex="0"><span class="n">${board.high}</span>High</div>
          <div class="sev-tile medium" data-tooltip="Real gaps worth fixing on a normal remediation timeline." tabindex="0"><span class="n">${board.medium}</span>Medium</div>
          <div class="sev-tile low" data-tooltip="Worth fixing, not urgent." tabindex="0"><span class="n">${board.low}</span>Low</div>
          <div class="sev-tile info" data-tooltip="Informational — a planning item, not a risk by itself." tabindex="0"><span class="n">${board.info}</span>Info</div>
        </div>
      </div>

      <section class="block">
        <h2 data-tooltip="The high-level narrative for leadership, built entirely from cited findings and evidence below." tabindex="0">Board Report</h2>
        <p class="section-sub">${board.claims.length} claims, every one traceable to a finding [F] or evidence [E] id</p>
        <div class="claim-list">
          ${claims.map(c => `<div class="claim">${escapeHtml(c.text)}${citeBadge(c)}</div>`).join('')}
        </div>
      </section>

      <section class="block">
        <h2 data-tooltip="The same findings translated into plain language, with a concrete fix for each." tabindex="0">Plain English</h2>
        <p class="section-sub">${plain.length} items — one per finding</p>
        <div class="plain-list">
          ${plain.map(p => `<div class="plain-item">${escapeHtml(p.text)}</div>`).join('')}
        </div>
      </section>

      <section class="block">
        <h2 data-tooltip="Every open finding this scan surfaced, ranked by severity, spanning all six finding categories." tabindex="0">Top Findings</h2>
        <p class="section-sub">${findings.length} findings — accessibility, availability, governance, privacy, security, third-party</p>
        <div class="overflow-x">
          <table class="data-table">
            <thead><tr><th>#</th><th>Rule</th><th>Category</th><th>Finding</th><th>Severity</th><th>Remediation</th></tr></thead>
            <tbody>
              ${findings.map(f => `<tr>
                <td class="mono-cell">${f.rank}</td>
                <td class="mono-cell" data-tooltip="Internal rule code that produced this finding." tabindex="0">${escapeHtml(f.rule_id)}</td>
                <td class="cat-chip">${escapeHtml(f.category.replace('_',' '))}</td>
                <td>${escapeHtml(f.title)}<div style="color:var(--text-dim); font-size:11.5px; margin-top:3px;">${escapeHtml(f.detail)}</div><div style="color:var(--text-dim); font-size:11px; margin-top:2px;">${escapeHtml(f.location)}</div>${Object.keys(f.framework_refs||{}).length ? `<div class="fw-refs">${Object.entries(f.framework_refs).map(([k,v])=>`${k}: ${v}`).join(' · ')}</div>` : ''}</td>
                <td><span class="sev-chip sev-${f.severity}">${f.severity}</span></td>
                <td style="color:var(--text-muted);">${escapeHtml(f.remediation)}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </section>

      <section class="block">
        <h2 data-tooltip="The raw captured proof (HTTP responses, headers, page content) every finding above cites." tabindex="0">Evidence Index</h2>
        <p class="section-sub">${evidence.length} captured evidence rows</p>
        <div class="overflow-x">
          <table class="data-table">
            <thead><tr><th>ID</th><th>Kind</th><th>URL</th><th>HTTP</th><th>Captured</th><th>SHA-256</th></tr></thead>
            <tbody>
              ${evidence.map(e => `<tr>
                <td class="mono-cell">E${e.evidence_id}</td>
                <td class="mono-cell">${escapeHtml(e.kind)}</td>
                <td style="word-break:break-all;">${escapeHtml(e.url)}</td>
                <td class="mono-cell">${e.http_status}</td>
                <td class="mono-cell">${new Date(e.captured_at).toLocaleString()}</td>
                <td class="mono-cell" data-tooltip="Cryptographic hash proving this evidence hasn't been altered since capture." tabindex="0">${escapeHtml(e.sha256.slice(0,12))}…</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </section>

      <footer class="disclaimer" data-tooltip="MUSTER assesses technical and policy signals; it is not a lawyer, auditor, or certifying body." tabindex="0">
        MUSTER's SITREP is a technical assessment, not a compliance certification or legal opinion. It does not constitute legal advice; organizations remain solely responsible for their own legal and regulatory obligations.
        <br>This document is a fictional composite sample built to demonstrate every finding category and severity level MUSTER can surface. It does not describe a real organization.
      </footer>
    `;
  }

  // Right-click context menu suppression. Added 2026-09-08 at the owner's explicit
  // request, after the tradeoff below was put to them in full.
  //
  // WHAT THIS DOES: suppresses the browser context menu on a real right-click.
  //
  // WHAT THIS DOES NOT DO, and nobody reading this later should think otherwise:
  // it does not protect this page's source. Ctrl+U, F12, the browser's own View
  // Page Source item, `curl`, Save Page As and simply turning JavaScript off all
  // still read every byte. This is a speed bump on one gesture, not a security
  // control, and it must never be cited as one in a SITREP, a control register,
  // or a conversation with a client.
  //
  // The protection that is real is architectural and already in place: auth, RLS,
  // the scan engine, posture scoring, control derivation and SITREP generation all
  // run in Postgres and edge functions. What ships to a browser is a renderer.
  //
  // Two carve-outs keep this from becoming an accessibility defect on a product
  // that sells accessibility auditing (A11Y-001..007):
  //
  //   1. Keyboard-invoked menus pass through. Screen reader and keyboard-only
  //      users open the context menu with the Menu key or Shift+F10, which arrives
  //      as a contextmenu event with button 0; a mouse right-click arrives with
  //      button 2. Only button 2 is suppressed, so the assistive path is untouched.
  //      Long-press on touch also reports button 0, so mobile copy and paste keeps
  //      working -- a long-press is not a right-click and blocking it would break
  //      text selection for every phone user to stop nobody.
  //   2. Text-entry surfaces keep their native menu. Right-click inside an input,
  //      textarea or contenteditable is how people paste and how spellcheck
  //      suggestions are reached. Taking that away is a usability failure with no
  //      upside, because a form field exposes no source.
  function initContextMenuGuard() {
    document.addEventListener('contextmenu', function (e) {
      if (e.button !== 2) return;
      var t = e.target;
      if (t && t.closest && t.closest('input, textarea, [contenteditable=""], [contenteditable="true"]')) return;
      e.preventDefault();
    });
  }

  function initTooltips() {
    const tip = document.createElement('div');
    tip.className = 'app-tooltip';
    tip.id = 'appTooltip';
    tip.setAttribute('role', 'tooltip');
    document.body.appendChild(tip);
    let current = null, suppressed = false;
    function findTarget(node) { return node && node.closest ? node.closest('[data-tooltip]') : null; }
    function show(target) {
      const text = target.getAttribute('data-tooltip');
      if (!text || suppressed) return;
      current = target; tip.textContent = text; tip.classList.add('show');
      target.setAttribute('aria-describedby', 'appTooltip');
      position(target);
    }
    function position(target) {
      const r = target.getBoundingClientRect(); const t = tip.getBoundingClientRect(); const gap = 8;
      let top = r.top - t.height - gap; if (top < 8) top = r.bottom + gap;
      let left = r.left + (r.width / 2) - (t.width / 2);
      left = Math.max(8, Math.min(left, window.innerWidth - t.width - 8));
      tip.style.top = `${Math.round(top)}px`; tip.style.left = `${Math.round(left)}px`;
    }
    function hide() { if (current) current.removeAttribute('aria-describedby'); current = null; tip.classList.remove('show'); }
    document.addEventListener('mouseover', (e) => { const t = findTarget(e.target); if (t && t !== current) show(t); else if (!t && current) hide(); });
    document.addEventListener('mouseout', (e) => { const t = findTarget(e.target); if (t && !t.contains(e.relatedTarget)) hide(); });
    document.addEventListener('focusin', (e) => { const t = findTarget(e.target); if (t) show(t); });
    document.addEventListener('focusout', hide);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && current) { hide(); suppressed = true; } });
    document.addEventListener('mousemove', () => { suppressed = false; }, { passive: true });
    window.addEventListener('scroll', () => { if (current) position(current); }, { passive: true, capture: true });
    window.addEventListener('resize', () => { if (current) position(current); });
  }

  window.addEventListener('DOMContentLoaded', () => { initTooltips(); initContextMenuGuard(); render(sampleSitrep); });
</script>
