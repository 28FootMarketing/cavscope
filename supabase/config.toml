# Supabase project configuration for MUSTER.
#
# project_id is MUSTER's own project. supabase/migrations/ holds that project's
# migrations, so the CLI's target and the migrations directory name the same
# project -- which is the only safe arrangement, because `supabase db push`
# applies whatever it finds in supabase/migrations/ to whichever project is
# linked. If you ever change project_id, move the migrations directory in the
# same commit.
#
# The old shared 28FS project mgtmqucaldkaxvxglguw is no longer this repo's
# target. MUSTER's 48 migrations against it are kept as history in
# supabase/migrations-shared-project/ and are not replayed.
project_id = "hjowfnzpomzxazmzywxw"

# Every function is declared, including the ones whose settings match the
# default. verify_jwt defaults to TRUE when a function is omitted, and most of
# these need FALSE -- an omitted entry is not a neutral choice, it is a wrong
# one that only shows up as 401s in production. Values below are the live
# settings, verified 2026-09-08 and re-read 2026-09-25 when the six functions
# at the bottom were found deployed but undeclared here.

[functions.muster-scan]
verify_jwt = true
entrypoint = "./functions/muster-scan/index.ts"

[functions.muster-verify-site]
verify_jwt = true
entrypoint = "./functions/muster-verify-site/index.ts"

[functions.muster-alert-dispatch]
verify_jwt = true
entrypoint = "./functions/muster-alert-dispatch/index.ts"

[functions.muster-agent]
# Custom auth: x-muster-api-key resolved in SQL. The gateway must accept agents without a Supabase JWT.
verify_jwt = false
entrypoint = "./functions/muster-agent/index.ts"

[functions.muster-watchdog]
# Shared secret: x-muster-secret against vault muster_cron_secret. Called by pg_cron.
verify_jwt = false
entrypoint = "./functions/muster-watchdog/index.ts"

[functions.muster-backfill-embeddings]
# Shared secret: x-muster-secret. Spends OpenRouter credit per record, so the
# in-function check is the only thing standing between this and an open endpoint.
verify_jwt = false
entrypoint = "./functions/muster-backfill-embeddings/index.ts"

[functions.muster-resend-webhook]
# Inbound Resend delivery/bounce/complaint events. Authentication IS the Svix
# signature (RESEND_WEBHOOK_SECRET); Resend cannot send a Supabase JWT.
verify_jwt = false
entrypoint = "./functions/muster-resend-webhook/index.ts"

[functions.muster-stripe-webhook]
# Stripe signs its own requests; verified against STRIPE_WEBHOOK_SECRET over the
# raw body. Stripe cannot present a Supabase JWT.
verify_jwt = false
entrypoint = "./functions/muster-stripe-webhook/index.ts"

[functions.muster-ghl-webhook]
# Shared secret: x-muster-secret against vault muster_ghl_webhook_secret. GHL's
# outbound webhook action cannot present a Supabase JWT.
verify_jwt = false
entrypoint = "./functions/muster-ghl-webhook/index.ts"

[functions.muster-embed-docs]
# Shared secret: x-muster-secret, same vault value as the backfill. Spends
# OpenRouter credit and rewrites what the agent reads back as documentation, so
# the in-function check is the only thing standing between this and an open
# endpoint. Called by tools/embed-docs/sync.ts, which holds no inference key.
verify_jwt = false
entrypoint = "./functions/muster-embed-docs/index.ts"

[functions.muster-auth-smoke]
# Shared secret: x-muster-secret, same vault value as the watchdog. It can mint a
# real recovery link with the service-role key, so an open endpoint here would be
# an account-takeover primitive -- the in-function check is the whole gate.
verify_jwt = false
entrypoint = "./functions/muster-auth-smoke/index.ts"

[functions.muster-set-password]
# The caller's own session JWT is the credential: the function re-verifies it
# with getUser() before touching the account. The gateway check is a first
# line, not the only one.
verify_jwt = true
entrypoint = "./functions/muster-set-password/index.ts"

[functions.muster-beta-notify]
# Shared secret: x-muster-signal against vault muster_beta_notify_secret. Called
# by the muster_beta_signups insert trigger through pg_net, which presents no
# Supabase JWT. Posts the Telegram alert.
verify_jwt = false
entrypoint = "./functions/muster-beta-notify/index.ts"

[functions.muster-beta-confirm]
# Same trigger, same x-muster-signal secret. Sends the confirmation email via
# Resend. With verify_jwt true the trigger's call is refused 401 and no email
# goes out, silently -- the row still inserts.
verify_jwt = false
entrypoint = "./functions/muster-beta-confirm/index.ts"

[functions.muster-beta-export]
# Shared secret in the query string (?key=) against vault muster_beta_export_key,
# because the consumer is a Google Sheets IMPORTDATA call, which can send no
# header. A URL-borne secret lands in access logs; rotate the key if the sheet
# is ever shared. Returns the signup list as CSV, service-role read.
verify_jwt = false
entrypoint = "./functions/muster-beta-export/index.ts"

[functions.muster-asset-admin]
# Shared secret: x-muster-signal against vault muster_asset_admin_secret.
# Uploads into the public brand-assets bucket with the service role.
verify_jwt = false
entrypoint = "./functions/muster-asset-admin/index.ts"

[functions.muster-telegram-debug]
# Retired: answers 410 to everything. Kept only because the MCP has no delete
# for edge functions; remove it with the CLI, then drop this entry and the dir.
verify_jwt = false
entrypoint = "./functions/muster-telegram-debug/index.ts"
