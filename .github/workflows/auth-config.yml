# Apply and verify the Supabase Auth configuration that cannot live in a migration.
#
# WHY THIS IS A WORKFLOW AND NOT A NOTE IN A README.
#
# Site URL on hjowfnzpomzxazmzywxw has to be https://app.muster.partners. It has
# been wrong since the project was created, it was believed corrected on
# 2026-09-13, and on 2026-09-15 a real magiclink again landed on
# https://www.muster.partners/ with live access and refresh tokens sitting in the
# URL fragment. The landing page now forwards such a fragment to the app host,
# but that is a mitigation for the defect, not the fix -- and a mitigation that
# hides a defect is how the defect survives.
#
# Auth config is not schema, so no migration can carry it, and it does not move
# between Supabase projects: it is set per project, by hand, in a dashboard.
# Anything set by hand and verified by memory drifts. So it is set here instead,
# from the commit, with the value read back from the API afterwards and the job
# failed if the readback disagrees. A green run is evidence; a note is not.
#
# The site_url step deliberately does NOT touch uri_allow_list on its own --
# PATCH is partial, so sending only site_url leaves the redirect allowlist
# alone -- and that list is load bearing (/app, /reset and the onboarding
# landings all have to be on it, or GoTrue silently substitutes Site URL and
# the link goes to the wrong place). It prints the allowlist so a human can
# eyeball it, and changes nothing on its own.
#
# add_redirect_urls is the opt-in, additive way to grow that list: empty
# (the default) reads and prints it, unchanged, same contract as
# smtp_sender_name and templates: skip. A non-empty value is merged in --
# union, not replace -- and the job fails if the readback is missing anything
# that was already there or anything just requested. Never remove an entry
# this way; a removal needs a human reading the full live list first, because
# an entry pulled out from under a link already delivered strands it exactly
# the way an un-allowlisted redirect_to does.
#
# Run it: Actions -> auth-config -> Run workflow. Leave `apply` unchecked for a
# read-only report of what is set today; check it to write the value.
name: auth-config

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Site URL to set on the Supabase project'
        type: string
        default: 'https://app.muster.partners'
      apply:
        description: 'Write the value. Unchecked = report what is set today and change nothing.'
        type: boolean
        default: false
      send_test_link:
        description: 'Send a real magic link to test_email. Sent WITHOUT redirect_to, so Site URL is what is under test.'
        type: boolean
        default: false
      test_email:
        description: 'Address to send the test magic link to. Must already be a user; no account is created.'
        type: string
        default: ''
      templates:
        description: 'Auth email templates: report what is live, or apply the six files from the repo.'
        type: choice
        options: ['skip', 'report', 'apply']
        default: 'skip'
      password_changed_notification:
        description: 'Email the account holder when their password changes. report = read the switch; on = enable (refused unless the branded template is live); off = disable. Default change nothing.'
        type: choice
        options: ['skip', 'report', 'on', 'off']
        default: 'skip'
      leaked_password_protection:
        description: 'Reject passwords found in HaveIBeenPwned when one is set or changed. report = read the switch; on = enable; off = disable. Default change nothing.'
        type: choice
        options: ['skip', 'report', 'on', 'off']
        default: 'skip'
      password_min_length:
        description: 'GoTrue minimum password length (6 to 72). Empty = change nothing. Never lowers the current value. Applies when a password is set or changed.'
        type: string
        default: ''
      smtp_sender_name:
        description: 'SMTP sender display name to set (e.g. CavScope). Empty = report the current value and change nothing.'
        type: string
        default: ''
      smtp_admin_email:
        description: 'SMTP From address to set (must be on a domain verified in Resend). Empty = change nothing.'
        type: string
        default: ''
      add_redirect_urls:
        description: 'Comma or newline separated URLs to ADD to the redirect allowlist. Additive only -- never removes an entry. Empty = report the current list and change nothing.'
        type: string
        default: ''

concurrency:
  group: auth-config
  cancel-in-progress: false

jobs:
  auth-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: guard
        name: Check the management token is configured
        env:
          PREFIXED: ${{ secrets.MUSTER_SUPABASE_ACCESS_TOKEN }}
          PLAIN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$PREFIXED" ] || [ -n "$PLAIN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::No Supabase management token is visible to this repository. Nothing was read or written."
            exit 1
          fi

      - name: Read, apply, verify
        env:
          TOKEN: ${{ secrets.MUSTER_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          WANT: ${{ inputs.site_url }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          REF=$(grep -E '^project_id' supabase/config.toml | head -1 | cut -d'"' -f2)
          API="https://api.supabase.com/v1/projects/$REF/config/auth"
          echo "Project: $REF"

          # Only ever print site_url and the allowlist. Never the response body,
          # which carries provider secrets and SMTP credentials.
          get_site() {
            curl -sS -f -H "Authorization: Bearer $TOKEN" "$API" | jq -r '.site_url // "(unset)"'
          }
          get_list() {
            curl -sS -f -H "Authorization: Bearer $TOKEN" "$API" | jq -r '.uri_allow_list // "(unset)"'
          }

          BEFORE=$(get_site)
          ALLOW=$(get_list)
          echo "site_url before : $BEFORE"
          echo "uri_allow_list  : $ALLOW"

          {
            echo "### Supabase Auth config -- `$REF`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| site_url before | `$BEFORE` |"
            echo "| requested | `$WANT` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$APPLY" != "true" ]; then
            echo "::notice::Read-only run. site_url is '$BEFORE'. Nothing was written."
            {
              echo "| result | **read-only, nothing written** |"
              echo ""
              echo "Redirect allowlist, unchanged by this job:"
              echo ""
              echo "```"
              echo "$ALLOW"
              echo "```"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Partial update. Only site_url is sent, so every other auth setting --
          # the redirect allowlist included -- is left exactly as it is.
          curl -sS -f -X PATCH "$API" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg u "$WANT" '{site_url:$u}')" > /dev/null

          AFTER=$(get_site)
          echo "site_url after  : $AFTER"

          if [ "$AFTER" != "$WANT" ]; then
            echo "::error::Readback disagrees. Wanted '$WANT', the API reports '$AFTER'. Site URL is NOT set."
            {
              echo "| site_url after | `$AFTER` |"
              echo "| result | **FAILED -- readback disagrees, value not applied** |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          AFTER_ALLOW=$(get_list)
          {
            echo "| site_url after | `$AFTER` |"
            echo "| result | **applied and verified by readback** |"
            echo ""
            echo "Redirect allowlist, untouched by this job:"
            echo ""
            echo "```"
            echo "$AFTER_ALLOW"
            echo "```"
            echo ""
            echo "A magic link still has to be sent and followed to call this done end to end."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::site_url is now $AFTER, confirmed by readback."

      # smtp_sender_name is the SMTP "From" display name -- distinct from
      # smtp_admin_email, which does not change with the rebrand (see
      # docs/BRAND-CUTOVER.md). Independent of `apply`: it only fires when the
      # input is non-empty, so a dispatch that leaves it blank reports the
      # current value and writes nothing, same contract as `templates: skip`.
      # smtp_pass and other provider secrets live on the same response body and
      # are never echoed here, same rule as every other step in this file.
      - name: SMTP sender name
        if: inputs.smtp_sender_name != ''
        env:
          TOKEN: ${{ secrets.MUSTER_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          WANT: ${{ inputs.smtp_sender_name }}
        run: |
          set -euo pipefail
          REF=$(grep -E '^project_id' supabase/config.toml | head -1 | cut -d'"' -f2)
          API="https://api.supabase.com/v1/projects/$REF/config/auth"

          get_sender() {
            curl -sS -f -H "Authorization: Bearer $TOKEN" "$API" | jq -r '.smtp_sender_name // "(unset)"'
          }

          BEFORE=$(get_sender)
          echo "smtp_sender_name before : $BEFORE"
          echo "requested                : $WANT"

          curl -sS -f -X PATCH "$API" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data "$(jq -nc --arg n "$WANT" '{smtp_sender_name:$n}')" > /dev/null

          AFTER=$(get_sender)
          echo "smtp_sender_name after  : $AFTER"

          {
            echo "### SMTP sender name"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| before | `$BEFORE` |"
            echo "| after | `$AFTER` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$AFTER" != "$WANT" ]; then
            echo "::error::Readback disagrees. Wanted '$WANT', the API reports '$AFTER'. Sender name is NOT set."
            echo "| result | **FAILED -- readback disagrees, value not applied** |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "| result | **applied and verified by readback** |" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::smtp_sender_name is now '$AFTER', confirmed by readback."

      - name: SMTP sender address
        if: inputs.smtp_admin_email != ''
        env:
          TOKEN: ${{ secrets.MUSTER_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          WANT: ${{ inputs.smtp_admin_email }}
        run: |
          set -euo pipefail
          REF=$(grep -E '^project_id' supabase/config.toml | head -1 | cut -d'"' -f2)
          API="https://api.supabase.com/v1/projects/$REF/config/auth"
          get_addr() { curl -sS -f -H "Authorization: Bearer $TOKEN" "$API" | jq -r '.smtp_admin_email // "(unset)"'; }
          BEFORE=$(get_addr)
          echo "smtp_admin_email before : $BEFORE"
          curl -sS -f -X PATCH "$API" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data "$(jq -nc --arg n "$WANT" '{smtp_admin_email:$n}')" > /dev/null
          AFTER=$(get_addr)
          echo "smtp_admin_email after  : $AFTER"
          {
            echo "### SMTP sender address"
            echo "| before | `$BEFORE` |"
            echo "| after | `$AFTER` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$AFTER" != "$WANT" ]; then
            echo "::error::Readback disagrees. Wanted '$WANT', the API reports '$AFTER'."
            exit 1
          fi
          echo "::notice::smtp_admin_email is now '$AFTER', confirmed by readback."

      - name: Redirect allowlist -- additive merge
        if: inputs.add_redirect_urls != ''
        env:
          TOKEN: ${{ secrets.MUSTER_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          ADD: ${{ inputs.add_redirect_urls }}
        run: |
          set -euo pipefail
          REF=$(grep -E '^project_id' supabase/config.toml | head -1 | cut -d'"' -f2)
          API="https://api.supabase.com/v1/projects/$REF/config/auth"

          get_list() {
            curl -sS -f -H "Authorization: Bearer $TOKEN" "$API" | jq -r '.uri_allow_list // ""'
          }

          BEFORE=$(get_list)
          echo "uri_allow_list before: $BEFORE"

          # Union, not replace. Normalise both sides to one-URL-per-line, drop
          # blanks, dedupe while preserving first-seen order so the existing
          # list's order (and anything a human reads off it) does not shuffle.
          MERGED=$( { echo "$BEFORE" | tr ',' '\n'; echo "$ADD" | tr ',' '\n'; } \
            | sed 's/^ *//; s/ *$//' | grep -v '^$' | awk '!seen[$0]++' | paste -sd, -)

          echo "requested additions:"
          echo "$ADD" | tr ',' '\n' | sed 's/^ *//; s/ *$//' | grep -v '^$'
          echo "uri_allow_list merged: $MERGED"

          curl -sS -f -X PATCH "$API" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data "$(jq -nc --arg l "$MERGED" '{uri_allow_list:$l}')" > /dev/null

          AFTER=$(get_list)
          echo "uri_allow_list after: $AFTER"

          {
            echo "### Redirect allowlist"
            echo ""
            echo "Before:"
            echo '```'
            echo "$BEFORE"
            echo '```'
            echo "After:"
            echo '```'
            echo "$AFTER"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail if anything that was there before, or anything just
          # requested, is missing from the readback -- this step only ever
          # grows the list, and a readback that dropped something silently
          # shrank it instead.
          FAIL=0
          while read -r url; do
            [ -z "$url" ] && continue
            case ",$AFTER," in
              *",$url,"*) ;;
              *) echo "::error::'$url' is missing from the readback."; FAIL=1 ;;
            esac
          done < <(echo "$MERGED" | tr ',' '\n')

          if [ "$FAIL" = "1" ]; then
            echo "| result | **FAILED -- readback missing an expected entry** |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "| result | **merged and verified by readback** |" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Redirect allowlist merged and verified. Nothing was removed."

      # Sending a link is a separate job from setting the field, deliberately.
      # Setting Site URL and delivering a working link are different claims, and
      # this repo has already conflated them once -- a note said the redirect was
      # handled while real magiclinks kept landing on the marketing site.
      - name: Report mail transport, then send a real magic link
        if: inputs.send_test_link
        env:
          TOKEN: ${{ secrets.MUSTER_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          TO: ${{ inputs.test_email }}
        run: |
          set -euo pipefail
          if [ -z "$TO" ]; then
            echo "::error::send_test_link was checked but test_email is empty. Nothing was sent."
            exit 1
          fi
          REF=$(grep -E '^project_id' supabase/config.toml | head -1 | cut -d'"' -f2)

          # Whether custom SMTP is configured decides how to read a missing email.
          # No custom SMTP means GoTrue's built-in sender, which is heavily rate
          # limited and is not a delivery path to rely on -- an email that never
          # arrives then says nothing about Site URL, which is what we are testing.
          CFG=$(curl -sS -f -H "Authorization: Bearer $TOKEN" \
                "https://api.supabase.com/v1/projects/$REF/config/auth")
          SMTP_HOST=$(jq -r 'if (.smtp_host // "") == "" then "not configured" else "configured" end' <<<"$CFG")
          SMTP_FROM=$(jq -r '.smtp_admin_email // "(none)"' <<<"$CFG")
          SITE=$(jq -r '.site_url // "(unset)"' <<<"$CFG")
          unset CFG   # carries smtp_pass and provider secrets; never echoed, never kept
          echo "site_url    : $SITE"
          echo "custom SMTP : $SMTP_HOST"
          echo "sender      : $SMTP_FROM"

          # The publishable key ships in page source by design, so it is read
          # from the page rather than stored as a secret -- one source, no drift.
          ANON=$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+' signin.html | head -1)
          if [ -z "$ANON" ]; then
            echo "::error::Could not find the publishable key in signin.html."
            exit 1
          fi

          # No redirect_to on purpose: GoTrue then falls back to Site URL, which
          # is precisely the setting under test. Passing a redirect would test the
          # parameter instead and prove nothing about the default.
          # create_user:false so a typo cannot silently mint an account.
          CODE=$(curl -sS -o /tmp/otp.json -w '%{http_code}' \
            -X POST "https://$REF.supabase.co/auth/v1/otp" \
            -H "apikey: $ANON" -H "Content-Type: application/json" \
            --data "$(jq -nc --arg e "$TO" '{email:$e, create_user:false}')")
          echo "POST /auth/v1/otp -> $CODE"

          {
            echo "### Magic link test"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| site_url in effect | `$SITE` |"
            echo "| custom SMTP | **$SMTP_HOST** |"
            echo "| sender | `$SMTP_FROM` |"
            echo "| POST /auth/v1/otp | `$CODE` |"
            echo "| redirect_to sent | **none, on purpose** -- the link should follow site_url |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CODE" != "200" ]; then
            echo "::error::GoTrue refused the request ($CODE). No link was sent."
            jq -r '.msg // .error_description // .error // "no message"' /tmp/otp.json 2>/dev/null || true
            echo "GoTrue rejected the request. No link was sent." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "**A 200 means GoTrue accepted the request. It does not mean the email arrived.**"
            echo "Check the inbox, then click the link and read the host it lands on:"
            echo ""
            echo "- lands on `app.muster.partners` -- Site URL is fixed and the flow works"
            echo "- lands on `www.muster.partners` -- the setting did not take effect"
            echo "- never arrives -- a mail transport problem, not a Site URL problem"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::GoTrue accepted the request ($CODE). Delivery is not confirmed by this; check the inbox."

      # The six GoTrue templates. Until 2026-09-17 these were six files in the
      # repo and six stock templates in production, with a README saying to
      # paste them across. Nothing checked that anyone had, and nobody had -- so
      # a paying customer's first contact with MUSTER was an unbranded "Confirm
      # your signup" from a security vendor.
      #
      # Subjects and flow names live in manifest.json rather than being parsed
      # out of the README's table, so the data a machine reads is the data a
      # human edits.
      - name: Auth email templates
        if: inputs.templates != 'skip'
        env:
          TOKEN: ${{ secrets.MUSTER_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          MODE: ${{ inputs.templates }}
        run: |
          set -euo pipefail
          REF=$(grep -E '^project_id' supabase/config.toml | head -1 | cut -d'"' -f2)
          API="https://api.supabase.com/v1/projects/$REF/config/auth"
          DIR=supabase/auth-email-templates

          curl -sS -f -H "Authorization: Bearer $TOKEN" "$API" > /tmp/cfg.json

          if [ "$MODE" = "report" ]; then
            # Names come from the live API, not from a guess. Content is printed
            # as a length only: these are not secrets, but a 5KB HTML dump per
            # template makes the useful signal unreadable.
            echo "### Auth email templates as they are live now" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| key | state |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            jq -r 'to_entries
                   | map(select(.key | startswith("mailer_")))
                   | sort_by(.key)[]
                   | "| `\(.key)` | " +
                     (if (.value == null or .value == "") then "**empty (GoTrue stock)**"
                      elif (.value | type) == "string" and (.value | length) > 60
                        then "set, \(.value | length) chars"
                      else "`\(.value | tostring)`" end) + " |"' /tmp/cfg.json \
              >> "$GITHUB_STEP_SUMMARY"
            jq -r 'to_entries | map(select(.key | startswith("mailer_"))) | sort_by(.key)[]
                   | .key + " => " + (if (.value == null or .value == "") then "EMPTY"
                     elif (.value|type)=="string" and (.value|length) > 60 then "set (" + (.value|length|tostring) + " chars)"
                     else (.value|tostring) end)' /tmp/cfg.json
            # Whether the security-notification emails are switched on at all.
            # Their enable flags are not mailer_-prefixed, and writing templates
            # for a path that never fires is the failure this repo keeps finding.
            # Booleans and key names only -- never a value from any other key,
            # because this response carries smtp_pass and provider secrets.
            echo "--- notification switches ---"
            jq -r 'to_entries
                   | map(select((.key | test("notification")) and ((.value|type) == "boolean")))
                   | sort_by(.key)[] | .key + " => " + (.value|tostring)' /tmp/cfg.json
            echo "--- (none above means no boolean notification switch exists) ---"
            rm -f /tmp/cfg.json
            echo "::notice::Report only. Nothing was written."
            exit 0
          fi

          # --- apply ---
          # Payload is built from the files, so the repo is the source of truth
          # and a template edited only in the dashboard is overwritten, which is
          # the intended direction.
          jq -n --slurpfile m $DIR/manifest.json \
            '$m[0] | map({ ("mailer_subjects_" + .flow): .subject }) | add' > /tmp/subjects.json
          echo '{}' > /tmp/contents.json
          while read -r flow file; do
            jq -n --rawfile c "$DIR/$file" --arg k "mailer_templates_${flow}_content" \
              '{($k): $c}' > /tmp/one.json
            jq -s '.[0] * .[1]' /tmp/contents.json /tmp/one.json > /tmp/merged.json
            mv /tmp/merged.json /tmp/contents.json
          done < <(jq -r '.[] | "\(.flow) \(.file)"' $DIR/manifest.json)
          jq -s '.[0] * .[1]' /tmp/subjects.json /tmp/contents.json > /tmp/payload.json
          echo "Applying $(jq 'keys | length' /tmp/payload.json) fields"

          curl -sS -f -X PATCH "$API" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/payload.json > /dev/null

          # Readback per template, compared by sha256 of the content. A wrong
          # field name PATCHes cleanly and changes nothing, so "the API returned
          # 200" is not evidence here -- only the comparison is.
          curl -sS -f -H "Authorization: Bearer $TOKEN" "$API" > /tmp/after.json
          {
            echo "### Auth email templates applied"
            echo ""
            echo "| flow | subject | content | verified |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          FAIL=0
          while read -r flow file subject; do
            # Both sides are normalised the same way before hashing. Command
            # substitution strips trailing newlines from the readback, so hashing
            # the file straight off disk compares a trailing newline against its
            # absence and reports all six as mismatched -- which it did on the
            # first run of this step. Normalise once, here, rather than relaxing
            # the comparison: the point of the check is to catch a real
            # difference, and a check loosened until it passes catches nothing.
            WANT=$(cat "$DIR/$file")
            GOT=$(jq -r --arg k "mailer_templates_${flow}_content" '.[$k] // ""' /tmp/after.json)
            WANT_SHA=$(printf '%s' "$WANT" | sha256sum | cut -c1-12)
            GOT_SHA=$(printf '%s' "$GOT" | sha256sum | cut -c1-12)
            GOT_SUBJ=$(jq -r --arg k "mailer_subjects_${flow}" '.[$k] // ""' /tmp/after.json)
            WANT_SUBJ=$(jq -r --arg f "$flow" '.[] | select(.flow==$f) | .subject' $DIR/manifest.json)
            if [ "$WANT_SHA" = "$GOT_SHA" ] && [ "$WANT_SUBJ" = "$GOT_SUBJ" ]; then OK="yes"; else OK="**NO**"; FAIL=1; fi
            echo "| `$flow` | `$GOT_SUBJ` | `$GOT_SHA` | $OK |" >> "$GITHUB_STEP_SUMMARY"
            echo "$flow: want ${#WANT} chars/$WANT_SHA, got ${#GOT} chars/$GOT_SHA, subject match=$([ "$WANT_SUBJ" = "$GOT_SUBJ" ] && echo yes || echo NO)"
          done < <(jq -r '.[] | "\(.flow) \(.file) \(.subject)"' $DIR/manifest.json)

          rm -f /tmp/cfg.json /tmp/after.json /tmp/payload.json /tmp/subjects.json /tmp/contents.json /tmp/one.json
          if [ "$FAIL" = "1" ]; then
            echo "::error::At least one template did not read back matching the repo. Not applied as intended."
            exit 1
          fi
          echo "::notice::All templates and subjects applied and verified by readback."

      # Leaked-password protection (GoTrue's password_hibp_enabled). Supabase's own
      # security advisor flags it as disabled (auth_leaked_password_protection, WARN,
      # read 2026-10-11). Enabled, GoTrue refuses a new or changed password that appears
      # in the HaveIBeenPwned corpus, by k-anonymity (only a hash prefix leaves the
      # project). It is checked when a password is SET: existing passwords are not
      # re-checked, and cavscope-set-password already shows GoTrue's refusal text. The
      # project plan may not offer the setting; then the PATCH fails and so does this
      # step, which is the correct outcome. Same contract as the switch above: report
      # reads, on/off writes and the job fails unless the readback agrees.
      - name: Leaked-password protection switch
        if: inputs.leaked_password_protection != 'skip'
        env:
          TOKEN: ${{ secrets.MUSTER_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          MODE: ${{ inputs.leaked_password_protection }}
        run: |
          set -euo pipefail
          REF=$(grep -E '^project_id' supabase/config.toml | head -1 | cut -d'"' -f2)
          API="https://api.supabase.com/v1/projects/$REF/config/auth"
          SW=password_hibp_enabled

          curl -sS -f -H "Authorization: Bearer $TOKEN" "$API" > /tmp/cfg.json
          LIVE_SW=$(jq -r --arg k "$SW" '.[$k] | tostring' /tmp/cfg.json)
          MINLEN=$(jq -r '.password_min_length | tostring' /tmp/cfg.json)
          rm -f /tmp/cfg.json
          echo "switch $SW = $LIVE_SW; password_min_length = $MINLEN"
          {
            echo "### Leaked-password protection"
            echo "- switch $SW: **$LIVE_SW**"
            echo "- password_min_length: **$MINLEN**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$MODE" = "report" ]; then echo "::notice::Report only. Nothing was written."; exit 0; fi

          if [ "$MODE" = "on" ]; then VAL=true; else VAL=false; fi
          jq -n --arg k "$SW" --argjson v "$VAL" '{($k): $v}' > /tmp/payload.json
          curl -sS -f -X PATCH "$API" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @/tmp/payload.json > /dev/null
          curl -sS -f -H "Authorization: Bearer $TOKEN" "$API" > /tmp/after.json
          NOW=$(jq -r --arg k "$SW" '.[$k] | tostring' /tmp/after.json)
          rm -f /tmp/after.json /tmp/payload.json
          echo "- after write, read back: **$NOW**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$NOW" != "$VAL" ]; then echo "::error::Readback says $NOW, wanted $VAL."; exit 1; fi
          echo "::notice::$SW is now $NOW, verified by readback."

      # GoTrue's minimum password length (password_min_length). It was 6 on
      # 2026-10-11 while the 12-character rule lived only in cavscope-set-password,
      # so the two flows that call auth.updateUser directly (password recovery in
      # signin.html, invite setup in onboarding.html) accepted 6. Setting it here
      # closes that at the source. The step runs only when a value is given. It must be an
      # integer from 6 to 72 and is verified by readback. It applies to passwords set
      # from now on; existing ones are untouched.
      - name: Minimum password length
        if: inputs.password_min_length != ''
        env:
          TOKEN: ${{ secrets.MUSTER_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          WANT: ${{ inputs.password_min_length }}
        run: |
          set -euo pipefail
          REF=$(grep -E '^project_id' supabase/config.toml | head -1 | cut -d'"' -f2)
          API="https://api.supabase.com/v1/projects/$REF/config/auth"
          curl -sS -f -H "Authorization: Bearer $TOKEN" "$API" > /tmp/cfg.json
          LIVE=$(jq -r '.password_min_length | tostring' /tmp/cfg.json)
          rm -f /tmp/cfg.json
          echo "password_min_length = $LIVE"
          { echo "### Minimum password length"; echo "- live: **$LIVE**"; } >> "$GITHUB_STEP_SUMMARY"
          case "$WANT" in ''|*[!0-9]*) echo "::error::password_min_length must be an integer, got '$WANT'."; exit 1;; esac
          if [ "$WANT" -lt 6 ] || [ "$WANT" -gt 72 ]; then echo "::error::password_min_length must be between 6 and 72, got $WANT."; exit 1; fi
          if [ "$WANT" -lt "$LIVE" ]; then echo "::error::Refusing to lower the minimum from $LIVE to $WANT."; exit 1; fi
          jq -n --argjson v "$WANT" '{password_min_length: $v}' > /tmp/payload.json
          curl -sS -f -X PATCH "$API" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @/tmp/payload.json > /dev/null
          curl -sS -f -H "Authorization: Bearer $TOKEN" "$API" > /tmp/after.json
          NOW=$(jq -r '.password_min_length | tostring' /tmp/after.json)
          rm -f /tmp/after.json /tmp/payload.json
          echo "- after write, read back: **$NOW**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$NOW" != "$WANT" ]; then echo "::error::Readback says $NOW, wanted $WANT."; exit 1; fi
          echo "::notice::password_min_length is now $NOW, verified by readback."

      # The password-changed notification switch. Off since the project began, so
      # changing a password mails the account holder nothing. Turning it on starts
      # mailing real users, an owner decision, so it is its own input and defaults
      # to nothing. `on` is refused unless the branded template is already live
      # (read back, not assumed): the first one a customer receives must not be
      # unbranded GoTrue stock from a security company. Run `templates: apply`
      # first, then this with `on`.
      - name: Password-changed notification switch
        if: inputs.password_changed_notification != 'skip'
        env:
          TOKEN: ${{ secrets.MUSTER_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          MODE: ${{ inputs.password_changed_notification }}
        run: |
          set -euo pipefail
          REF=$(grep -E '^project_id' supabase/config.toml | head -1 | cut -d'"' -f2)
          API="https://api.supabase.com/v1/projects/$REF/config/auth"
          DIR=supabase/auth-email-templates
          SW=mailer_notifications_password_changed_enabled
          TK=mailer_templates_password_changed_notification_content
          FILE=$(jq -r '.[] | select(.flow=="password_changed_notification") | .file' $DIR/manifest.json)

          curl -sS -f -H "Authorization: Bearer $TOKEN" "$API" > /tmp/cfg.json
          LIVE_SW=$(jq -r --arg k "$SW" '.[$k] | tostring' /tmp/cfg.json)
          WANT=$(cat "$DIR/$FILE")
          WANT_SHA=$(printf '%s' "$WANT" | sha256sum | cut -c1-12)
          GOT=$(jq -r --arg k "$TK" '.[$k] // ""' /tmp/cfg.json)
          GOT_SHA=$(printf '%s' "$GOT" | sha256sum | cut -c1-12)
          if [ "$WANT_SHA" = "$GOT_SHA" ]; then TPL="live, matches repo"; else TPL="NOT live or differs from repo"; fi
          echo "switch $SW = $LIVE_SW; template: $TPL ($WANT_SHA want, $GOT_SHA live)"
          {
            echo "### Password-changed notification"
            echo "- switch $SW: **$LIVE_SW**"
            echo "- branded template: **$TPL**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$MODE" = "report" ]; then rm -f /tmp/cfg.json; echo "::notice::Report only. Nothing was written."; exit 0; fi

          if [ "$MODE" = "on" ]; then
            if [ "$WANT_SHA" != "$GOT_SHA" ]; then
              rm -f /tmp/cfg.json
              echo "::error::Refusing to enable: the branded template is not live. Run with templates: apply first."
              exit 1
            fi
            VAL=true
          else
            VAL=false
          fi
          jq -n --arg k "$SW" --argjson v "$VAL" '{($k): $v}' > /tmp/payload.json
          curl -sS -f -X PATCH "$API" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @/tmp/payload.json > /dev/null
          curl -sS -f -H "Authorization: Bearer $TOKEN" "$API" > /tmp/after.json
          NOW=$(jq -r --arg k "$SW" '.[$k] | tostring' /tmp/after.json)
          rm -f /tmp/cfg.json /tmp/after.json /tmp/payload.json
          echo "- after write, read back: **$NOW**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$NOW" != "$VAL" ]; then echo "::error::Readback says $NOW, wanted $VAL."; exit 1; fi
          echo "::notice::$SW is now $NOW, verified by readback."
