# Apply and verify the Supabase Auth configuration that cannot live in a migration.
#
# WHY THIS IS A WORKFLOW AND NOT A NOTE IN A README.
#
# Site URL on hjowfnzpomzxazmzywxw has to be https://app.muster.partners. It has
# been wrong since the project was created, it was believed corrected on
# 2026-09-13, and on 2026-09-15 a real magiclink again landed on
# https://www.muster.partners/ with live access and refresh tokens sitting in the
# URL fragment. The landing page now forwards such a fragment to the app host,
# but that is a mitigation for the defect, not the fix -- and a mitigation that
# hides a defect is how the defect survives.
#
# Auth config is not schema, so no migration can carry it, and it does not move
# between Supabase projects: it is set per project, by hand, in a dashboard.
# Anything set by hand and verified by memory drifts. So it is set here instead,
# from the commit, with the value read back from the API afterwards and the job
# failed if the readback disagrees. A green run is evidence; a note is not.
#
# This deliberately does NOT touch uri_allow_list. PATCH is partial, so sending
# only site_url leaves the redirect allowlist alone -- and that list is load
# bearing (/app, /reset and the onboarding landings all have to be on it, or
# GoTrue silently substitutes Site URL and the link goes to the wrong place).
# The run prints the allowlist so a human can eyeball it, and changes nothing.
#
# Run it: Actions -> auth-config -> Run workflow. Leave `apply` unchecked for a
# read-only report of what is set today; check it to write the value.
name: auth-config

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Site URL to set on the Supabase project'
        type: string
        default: 'https://app.muster.partners'
      apply:
        description: 'Write the value. Unchecked = report what is set today and change nothing.'
        type: boolean
        default: false
      send_test_link:
        description: 'Send a real magic link to test_email. Sent WITHOUT redirect_to, so Site URL is what is under test.'
        type: boolean
        default: false
      test_email:
        description: 'Address to send the test magic link to. Must already be a user; no account is created.'
        type: string
        default: ''
      templates:
        description: 'Auth email templates: report what is live, or apply the six files from the repo.'
        type: choice
        options: ['skip', 'report', 'apply']
        default: 'skip'

concurrency:
  group: auth-config
  cancel-in-progress: false

jobs:
  auth-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: guard
        name: Check the management token is configured
        env:
          PREFIXED: ${{ secrets.MUSTER_SUPABASE_ACCESS_TOKEN }}
          PLAIN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$PREFIXED" ] || [ -n "$PLAIN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::No Supabase management token is visible to this repository. Nothing was read or written."
            exit 1
          fi

      - name: Read, apply, verify
        env:
          TOKEN: ${{ secrets.MUSTER_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          WANT: ${{ inputs.site_url }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          REF=$(grep -E '^project_id' supabase/config.toml | head -1 | cut -d'"' -f2)
          API="https://api.supabase.com/v1/projects/$REF/config/auth"
          echo "Project: $REF"

          # Only ever print site_url and the allowlist. Never the response body,
          # which carries provider secrets and SMTP credentials.
          get_site() {
            curl -sS -f -H "Authorization: Bearer $TOKEN" "$API" | jq -r '.site_url // "(unset)"'
          }
          get_list() {
            curl -sS -f -H "Authorization: Bearer $TOKEN" "$API" | jq -r '.uri_allow_list // "(unset)"'
          }

          BEFORE=$(get_site)
          ALLOW=$(get_list)
          echo "site_url before : $BEFORE"
          echo "uri_allow_list  : $ALLOW"

          {
            echo "### Supabase Auth config -- \`$REF\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| site_url before | \`$BEFORE\` |"
            echo "| requested | \`$WANT\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$APPLY" != "true" ]; then
            echo "::notice::Read-only run. site_url is '$BEFORE'. Nothing was written."
            {
              echo "| result | **read-only, nothing written** |"
              echo ""
              echo "Redirect allowlist, unchanged by this job:"
              echo ""
              echo "\`\`\`"
              echo "$ALLOW"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Partial update. Only site_url is sent, so every other auth setting --
          # the redirect allowlist included -- is left exactly as it is.
          curl -sS -f -X PATCH "$API" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg u "$WANT" '{site_url:$u}')" > /dev/null

          AFTER=$(get_site)
          echo "site_url after  : $AFTER"

          if [ "$AFTER" != "$WANT" ]; then
            echo "::error::Readback disagrees. Wanted '$WANT', the API reports '$AFTER'. Site URL is NOT set."
            {
              echo "| site_url after | \`$AFTER\` |"
              echo "| result | **FAILED -- readback disagrees, value not applied** |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          AFTER_ALLOW=$(get_list)
          {
            echo "| site_url after | \`$AFTER\` |"
            echo "| result | **applied and verified by readback** |"
            echo ""
            echo "Redirect allowlist, untouched by this job:"
            echo ""
            echo "\`\`\`"
            echo "$AFTER_ALLOW"
            echo "\`\`\`"
            echo ""
            echo "A magic link still has to be sent and followed to call this done end to end."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::site_url is now $AFTER, confirmed by readback."

      # Sending a link is a separate job from setting the field, deliberately.
      # Setting Site URL and delivering a working link are different claims, and
      # this repo has already conflated them once -- a note said the redirect was
      # handled while real magiclinks kept landing on the marketing site.
      - name: Report mail transport, then send a real magic link
        if: inputs.send_test_link
        env:
          TOKEN: ${{ secrets.MUSTER_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          TO: ${{ inputs.test_email }}
        run: |
          set -euo pipefail
          if [ -z "$TO" ]; then
            echo "::error::send_test_link was checked but test_email is empty. Nothing was sent."
            exit 1
          fi
          REF=$(grep -E '^project_id' supabase/config.toml | head -1 | cut -d'"' -f2)

          # Whether custom SMTP is configured decides how to read a missing email.
          # No custom SMTP means GoTrue's built-in sender, which is heavily rate
          # limited and is not a delivery path to rely on -- an email that never
          # arrives then says nothing about Site URL, which is what we are testing.
          CFG=$(curl -sS -f -H "Authorization: Bearer $TOKEN" \
                "https://api.supabase.com/v1/projects/$REF/config/auth")
          SMTP_HOST=$(jq -r 'if (.smtp_host // "") == "" then "not configured" else "configured" end' <<<"$CFG")
          SMTP_FROM=$(jq -r '.smtp_admin_email // "(none)"' <<<"$CFG")
          SITE=$(jq -r '.site_url // "(unset)"' <<<"$CFG")
          unset CFG   # carries smtp_pass and provider secrets; never echoed, never kept
          echo "site_url    : $SITE"
          echo "custom SMTP : $SMTP_HOST"
          echo "sender      : $SMTP_FROM"

          # The publishable key ships in page source by design, so it is read
          # from the page rather than stored as a secret -- one source, no drift.
          ANON=$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+' signin.html | head -1)
          if [ -z "$ANON" ]; then
            echo "::error::Could not find the publishable key in signin.html."
            exit 1
          fi

          # No redirect_to on purpose: GoTrue then falls back to Site URL, which
          # is precisely the setting under test. Passing a redirect would test the
          # parameter instead and prove nothing about the default.
          # create_user:false so a typo cannot silently mint an account.
          CODE=$(curl -sS -o /tmp/otp.json -w '%{http_code}' \
            -X POST "https://$REF.supabase.co/auth/v1/otp" \
            -H "apikey: $ANON" -H "Content-Type: application/json" \
            --data "$(jq -nc --arg e "$TO" '{email:$e, create_user:false}')")
          echo "POST /auth/v1/otp -> $CODE"

          {
            echo "### Magic link test"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| site_url in effect | \`$SITE\` |"
            echo "| custom SMTP | **$SMTP_HOST** |"
            echo "| sender | \`$SMTP_FROM\` |"
            echo "| POST /auth/v1/otp | \`$CODE\` |"
            echo "| redirect_to sent | **none, on purpose** -- the link should follow site_url |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CODE" != "200" ]; then
            echo "::error::GoTrue refused the request ($CODE). No link was sent."
            jq -r '.msg // .error_description // .error // "no message"' /tmp/otp.json 2>/dev/null || true
            echo "GoTrue rejected the request. No link was sent." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "**A 200 means GoTrue accepted the request. It does not mean the email arrived.**"
            echo "Check the inbox, then click the link and read the host it lands on:"
            echo ""
            echo "- lands on \`app.muster.partners\` -- Site URL is fixed and the flow works"
            echo "- lands on \`www.muster.partners\` -- the setting did not take effect"
            echo "- never arrives -- a mail transport problem, not a Site URL problem"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::GoTrue accepted the request ($CODE). Delivery is not confirmed by this; check the inbox."

      # The six GoTrue templates. Until 2026-09-17 these were six files in the
      # repo and six stock templates in production, with a README saying to
      # paste them across. Nothing checked that anyone had, and nobody had -- so
      # a paying customer's first contact with MUSTER was an unbranded "Confirm
      # your signup" from a security vendor.
      #
      # Subjects and flow names live in manifest.json rather than being parsed
      # out of the README's table, so the data a machine reads is the data a
      # human edits.
      - name: Auth email templates
        if: inputs.templates != 'skip'
        env:
          TOKEN: ${{ secrets.MUSTER_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          MODE: ${{ inputs.templates }}
        run: |
          set -euo pipefail
          REF=$(grep -E '^project_id' supabase/config.toml | head -1 | cut -d'"' -f2)
          API="https://api.supabase.com/v1/projects/$REF/config/auth"
          DIR=supabase/auth-email-templates

          curl -sS -f -H "Authorization: Bearer $TOKEN" "$API" > /tmp/cfg.json

          if [ "$MODE" = "report" ]; then
            # Names come from the live API, not from a guess. Content is printed
            # as a length only: these are not secrets, but a 5KB HTML dump per
            # template makes the useful signal unreadable.
            echo "### Auth email templates as they are live now" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| key | state |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            jq -r 'to_entries
                   | map(select(.key | startswith("mailer_")))
                   | sort_by(.key)[]
                   | "| `\(.key)` | " +
                     (if (.value == null or .value == "") then "**empty (GoTrue stock)**"
                      elif (.value | type) == "string" and (.value | length) > 60
                        then "set, \(.value | length) chars"
                      else "`\(.value | tostring)`" end) + " |"' /tmp/cfg.json \
              >> "$GITHUB_STEP_SUMMARY"
            jq -r 'to_entries | map(select(.key | startswith("mailer_"))) | sort_by(.key)[]
                   | .key + " => " + (if (.value == null or .value == "") then "EMPTY"
                     elif (.value|type)=="string" and (.value|length) > 60 then "set (" + (.value|length|tostring) + " chars)"
                     else (.value|tostring) end)' /tmp/cfg.json
            rm -f /tmp/cfg.json
            echo "::notice::Report only. Nothing was written."
            exit 0
          fi

          # --- apply ---
          # Payload is built from the files, so the repo is the source of truth
          # and a template edited only in the dashboard is overwritten, which is
          # the intended direction.
          jq -n --slurpfile m $DIR/manifest.json \
            '$m[0] | map({ ("mailer_subjects_" + .flow): .subject }) | add' > /tmp/subjects.json
          echo '{}' > /tmp/contents.json
          while read -r flow file; do
            jq -n --rawfile c "$DIR/$file" --arg k "mailer_templates_${flow}_content" \
              '{($k): $c}' > /tmp/one.json
            jq -s '.[0] * .[1]' /tmp/contents.json /tmp/one.json > /tmp/merged.json
            mv /tmp/merged.json /tmp/contents.json
          done < <(jq -r '.[] | "\(.flow) \(.file)"' $DIR/manifest.json)
          jq -s '.[0] * .[1]' /tmp/subjects.json /tmp/contents.json > /tmp/payload.json
          echo "Applying $(jq 'keys | length' /tmp/payload.json) fields"

          curl -sS -f -X PATCH "$API" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/payload.json > /dev/null

          # Readback per template, compared by sha256 of the content. A wrong
          # field name PATCHes cleanly and changes nothing, so "the API returned
          # 200" is not evidence here -- only the comparison is.
          curl -sS -f -H "Authorization: Bearer $TOKEN" "$API" > /tmp/after.json
          {
            echo "### Auth email templates applied"
            echo ""
            echo "| flow | subject | content | verified |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          FAIL=0
          while read -r flow file subject; do
            # Both sides are normalised the same way before hashing. Command
            # substitution strips trailing newlines from the readback, so hashing
            # the file straight off disk compares a trailing newline against its
            # absence and reports all six as mismatched -- which it did on the
            # first run of this step. Normalise once, here, rather than relaxing
            # the comparison: the point of the check is to catch a real
            # difference, and a check loosened until it passes catches nothing.
            WANT=$(cat "$DIR/$file")
            GOT=$(jq -r --arg k "mailer_templates_${flow}_content" '.[$k] // ""' /tmp/after.json)
            WANT_SHA=$(printf '%s' "$WANT" | sha256sum | cut -c1-12)
            GOT_SHA=$(printf '%s' "$GOT" | sha256sum | cut -c1-12)
            GOT_SUBJ=$(jq -r --arg k "mailer_subjects_${flow}" '.[$k] // ""' /tmp/after.json)
            WANT_SUBJ=$(jq -r --arg f "$flow" '.[] | select(.flow==$f) | .subject' $DIR/manifest.json)
            if [ "$WANT_SHA" = "$GOT_SHA" ] && [ "$WANT_SUBJ" = "$GOT_SUBJ" ]; then OK="yes"; else OK="**NO**"; FAIL=1; fi
            echo "| \`$flow\` | \`$GOT_SUBJ\` | \`$GOT_SHA\` | $OK |" >> "$GITHUB_STEP_SUMMARY"
            echo "$flow: want ${#WANT} chars/$WANT_SHA, got ${#GOT} chars/$GOT_SHA, subject match=$([ "$WANT_SUBJ" = "$GOT_SUBJ" ] && echo yes || echo NO)"
          done < <(jq -r '.[] | "\(.flow) \(.file) \(.subject)"' $DIR/manifest.json)

          rm -f /tmp/cfg.json /tmp/after.json /tmp/payload.json /tmp/subjects.json /tmp/contents.json /tmp/one.json
          if [ "$FAIL" = "1" ]; then
            echo "::error::At least one template did not read back matching the repo. Not applied as intended."
            exit 1
          fi
          echo "::notice::All six templates and subjects applied and verified by readback."
